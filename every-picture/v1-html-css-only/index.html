<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Every Picture</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Hegarty&family=Raleway&display=swap" rel="stylesheet">
    <!-- style sheet -->
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="container">
        <header>
            <div class="banner">
                <img src="../../images/banner-asset.svg" alt="blue-banner">
                <div class="banner-text">
                    <h1>Every Picture</h1>
                    <h2>DES 157 - Interactive Media II - Winter 2026</h2>
                </div>
                <div id="smile"><img src="../../images/smile.svg" alt="smile" width="133" height="64"></div>
                <div id="top-swoop"><img src="../../images/swoop-top.svg" alt="top-swoop" width="296" height="151"></div>
                <div id="alright"><img src="../../images/alright.svg" alt="alright" width="195" height="101"></div>
            </div>
        </header>
        <main>
            <div id="img1">
                <img src="images/fish-red-2.jpg" alt="red-fish" id="base">
                <img src="images/fish-green-2.jpg" alt="green-fish" class="overlay">
                <img src="images/fish-blue-2.jpg" alt="blue-fish" class="overlay">
            </div>
            <div id="img2">
                <img src="images/truck-red.jpg" alt="red-truck" id="base">
                <img src="images/truck-green.jpg" alt="green-truck" class="overlay">
                <img src="images/truck-blue.jpg" alt="blue-truck" class="overlay">
            </div>
            <div id="img3">
                <img src="images/carry-red.jpg" alt="red-carry" id="base">
                <img src="images/carry-green.jpg" alt="green-carry" class="overlay">
                <img src="images/carry-blue.jpg" alt="blue-carry" class="overlay">
            </div>
        </main>
        <footer>
            <div class="footer-banner">
                <img src="../../images/footer.svg" alt="blue-footer">
                <div class="footer-banner-text">
                    <p>Toscano, Eric | &#101;&#114;&#116;&#111;&#115;&#099;&#097;&#110;&#111;&#064;&#117;&#099;&#100;&#097;&#118;&#105;&#115;&#046;&#101;&#100;&#117;</p>
                </div>
            </div>
        </footer>
    </div>
</body>

</html>
