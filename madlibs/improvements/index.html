<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mad Libs</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Hegarty&family=Raleway&display=swap" rel="stylesheet">
    <!-- style sheet -->
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="container">
        <header>
            <div class="banner">
                <img src="../../images/banner-asset.svg" alt="blue-banner">
                <div class="banner-text">
                    <h1>
                        <span class="letterM">M</span>
                        <span class="letterA">A</span>
                        <span class="letterD">D</span>
                        <span class="letterL">L</span>
                        <span class="letterI">I</span>
                        <span class="letterB">B</span>
                        <span class="letterS">S</span>
                    </h1>
                <!-- <h2>DES 157 - Interactive Media II - Winter 2026</h2> -->
                </div>
                <div id="smile"><img src="../../images/smile.svg" alt="smile" width="133" height="64"></div>
                <div id="top-swoop"><img src="../../images/swoop-top.svg" alt="top-swoop" width="296" height="151"></div>
                <div id="alright"><img src="../../images/alright.svg" alt="alright" width="195" height="101"></div>
            </div>
        </header>
        <main>
            <!-- <div id="mainContainer"> -->
            <div id="smiles"><img src="../images/smiles.svg" alt="smiles" width="244" height="261"></div>
            <div id="pizza"><img src="../images/pizza.svg" alt="pizza" width="152" height="162"></div>
            <!-- </div> -->
            <form>
                <div class="break">
                    <div class="form-field">
                        <label for="interjection">Interjection</label>
                        <input type="text" id="interjection">
                    </div>
                    <p>! You are ordering</p>
                    <div class="form-field">
                        <label for="number">number</label>
                        <input type="number" id="number">
                    </div>
                    <div class="form-field">
                        <label for="fNoun">noun</label>
                        <input type="text" id="fNoun">
                    </div>
                    <p>pizzas!?</p>
                </div>

                <div class="break">
                    <p>Are you</p>
                    <div class="form-field">
                        <label for="fAdjective">adjective</label>
                        <input type="text" id="fAdjective">
                    </div>
                    <p>? Where will we be</p>
                    <div class="form-field">
                        <label for="fVerb">verb ending with "ing"</label>
                        <input type="text" id="fVerb">
                    </div>
                    <p>these pizzas?</p>        
                </div>

                <div class="break">
                    <p>Gather your</p>
                    <div class="form-field">
                        <label for="sAdjective">adjective</label>
                        <input type="text" id="sAdjective">
                    </div>
                    <div class="form-field">
                        <label for="sNoun">noun</label>
                        <input type="text" id="sNoun">
                    </div>
                    <p>.</p>
                </div>

                <div class="break">
                    <p>We will need help</p>
                    <div class="form-field">
                        <label for="sVerb">same verb</label>
                        <input type="text" id="sVerb">
                    </div>
                    <p>these pizzas.</p>
                </div>

                <div class="break">
                    <p>When we are</p>
                    <div class="form-field">
                        <label for="tAdjective">adjective</label>
                        <input type="text" id="tAdjective">
                    </div>
                    <p>we can</p>
                    <div class="form-field">
                        <label for="tVerb">verb ending without "ing"</label>
                        <input type="text" id="tVerb">
                    </div>
                    <p>back to the</p>
                    <div class="form-field">
                        <label for="tNoun">noun</label>
                        <input type="text" id="tNoun">
                    </div>
                    <p>.</p>
                </div>
                <div id="endPage">
                    <div class="button">
                        <input type="submit" name="reveal" value="reveal!">
                    </div>
                    <div class="button">
                        <input type="reset" name="resetMad" value="reset">
                    </div>
                    <div id="alert">
                        <p></p>
                    </div>
                </div>
            </form>
            
        </main>
        <footer>
            <div class="footer-banner">
                <img src="../../images/footer.svg" alt="blue-footer">
                <div class="footer-banner-text">
                    <p>Toscano, Eric | &#101;&#114;&#116;&#111;&#115;&#099;&#097;&#110;&#111;&#064;&#117;&#099;&#100;&#097;&#118;&#105;&#115;&#046;&#101;&#100;&#117;</p>
                </div>
            </div>
        </footer>
    </div>
    
</body>
</html>
